name: Verify forest

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ecology:
        description: Also run the slow ecology gates (360-day mainland, three-year island)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vana_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: vana_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vana_ci -d vana_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://vana_ci:isolated-ci-only@127.0.0.1:5432/vana_ci_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:ci
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-evidence
          path: .ci-artifacts/**/tests.json
          if-no-files-found: warn
          retention-days: 14

  ecology:
    if: github.event_name == 'workflow_dispatch' && inputs.ecology
    runs-on: ubuntu-latest
    # The 360-day mainland gate takes roughly a quarter of an hour. Each three-year island seed
    # took 32-36 minutes on a loaded 10-core development Mac (2026-10-05), and the three seeds run
    # side by side, so on a 2-4 vCPU runner the island gate alone can approach an hour. 120
    # minutes leaves room for both without letting a hung run hold a runner indefinitely.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p .ci-artifacts
      - name: Run multi-seed ecology gate (not the 50-year release gate)
        run: npm exec -- vitest run packages/runner/test/soak.test.ts --reporter=default --reporter=json --outputFile.json=.ci-artifacts/ecology.json
      - name: Run three-seed, three-world-year island gate
        # Runs even when the mainland gate failed, so both sets of evidence are kept.
        if: success() || failure()
        env:
          VANA_LONG_SOAK: '1'
          VANA_LONG_SOAK_TERRAIN: island_v1
          VANA_LONG_SOAK_DAYS: '1080'
          VANA_LONG_SOAK_OUTPUT: .ci-artifacts/multi-year
        run: |
          mkdir -p .ci-artifacts/multi-year
          pids=()
          for seed in 1 2 3; do
            VANA_LONG_SOAK_SEEDS=$seed npm exec -- vitest run packages/runner/test/soak-long.test.ts \
              --reporter=default --reporter=json --outputFile.json=.ci-artifacts/multi-year/seed$seed-tests.json \
              > .ci-artifacts/multi-year/seed$seed.log 2>&1 &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          tail -n 60 .ci-artifacts/multi-year/seed*.log
          exit $status
      - name: Retain ecology test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecology-evidence
          path: |
            .ci-artifacts/ecology.json
            .ci-artifacts/multi-year/**
          if-no-files-found: warn
          retention-days: 14
