name: vana-30day

services:
  db:
    # Pinned by digest, as the server and web images are (deploy/README.md, "Image digests").
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    environment:
      POSTGRES_USER: vana
      POSTGRES_DB: vana
      POSTGRES_PASSWORD: ${VANA_DB_PASSWORD:?set a random URL-safe database password}
    volumes:
      - db_data:/var/lib/postgresql/data
    # The entrypoint fixes the data folder's owner, then runs postgres as its own user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vana -d vana"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vana:${VANA_DB_PASSWORD:?set a random URL-safe database password}@db:5432/vana
      PORT: "8080"
      WORLD_SEED: ${VANA_WORLD_SEED:-1}
      # 1 = real time (the live-agents world); 12 = the original watch-only pace.
      WORLD_HOURS_PER_REAL_HOUR: ${WORLD_HOURS_PER_REAL_HOUR:-12}
      # Caddy is the only way in; trust its X-Forwarded-For so limits are per visitor.
      VANA_TRUSTED_PROXY_HOPS: "1"
      # General per-visitor limits; empty means the built-in defaults (see env.example).
      VANA_PUBLIC_READS_PER_MINUTE: ${VANA_PUBLIC_READS_PER_MINUTE:-}
      VANA_LIVE_MAX_CONNECTIONS: ${VANA_LIVE_MAX_CONNECTIONS:-}
      VANA_LIVE_MAX_CONNECTIONS_PER_NETWORK: ${VANA_LIVE_MAX_CONNECTIONS_PER_NETWORK:-}
      VANA_LIVE_CONNECTS_PER_MINUTE: ${VANA_LIVE_CONNECTS_PER_MINUTE:-}
      # The admin routes only from these addresses (env.example); empty means from anywhere, by token.
      VANA_ADMIN_ALLOW_IPS: ${VANA_ADMIN_ALLOW_IPS:-}
      # Prometheus metrics on an internal port that is never published or proxied (README).
      VANA_METRICS_PORT: ${VANA_METRICS_PORT:-}
      VANA_METRICS_HOST: ${VANA_METRICS_HOST:-}
      # Observer rewards: off unless all three are set in deploy/.env.
      VANA_REWARD_NETWORK: ${VANA_REWARD_NETWORK:-}
      VANA_REWARD_POLICY: ${VANA_REWARD_POLICY:-}
      VANA_REWARD_ADMIN_TOKEN: ${VANA_REWARD_ADMIN_TOKEN:-}
      VANA_REWARD_MIN_WATCH_SECONDS: ${VANA_REWARD_MIN_WATCH_SECONDS:-}
      VANA_REWARD_WALLET_DAILY_LIMIT: ${VANA_REWARD_WALLET_DAILY_LIMIT:-}
      VANA_REWARD_CLIENT_DAILY_LIMIT: ${VANA_REWARD_CLIENT_DAILY_LIMIT:-}
      # AI agents steering animals (docs/2026-09-26-live-agents-design.md). Off unless 1.
      VANA_LIVE_AGENTS: ${VANA_LIVE_AGENTS:-}
      VANA_AGENT_SLOTS: ${VANA_AGENT_SLOTS:-}
      VANA_AGENT_REGISTRATIONS_PER_NETWORK: ${VANA_AGENT_REGISTRATIONS_PER_NETWORK:-}
      VANA_LIVE_SECRET: ${VANA_LIVE_SECRET:-}
      # Optional observer insights from TypeSafe AI (Jev). Off without a key.
      TYPESAFE_AI_API_KEY: ${TYPESAFE_AI_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-}
      TYPESAFE_DAILY_CALLS: ${TYPESAFE_DAILY_CALLS:-}
      # sim_0.37.0: new worlds are founded on island_v2 (about 26 km² of land). A saved world
      # never changes terrain: a database holding an island_v1 world boots only with
      # VANA_TERRAIN_PROFILE=island_v1 set in the environment (see deploy/README.md).
      VANA_TERRAIN_PROFILE: ${VANA_TERRAIN_PROFILE:-island_v2}
      VANA_COMMUNITY_PROFILE: household_v1
    # Node runs as the node user on port 8080: it needs no capability at all.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      server:
        condition: service_healthy
    environment:
      VANA_DOMAIN: ${VANA_DOMAIN:?set your public domain}
      # Cloudflare's ranges when the site is behind it (deploy/single-server/README.md); otherwise none.
      VANA_TRUSTED_PROXIES: ${VANA_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Caddy binds 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  db_data:
  caddy_data:
  caddy_config:
