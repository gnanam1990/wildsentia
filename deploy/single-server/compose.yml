# Wildsentia on one server (deploy/single-server/README.md): the same images as the VPS
# package (deploy/compose.yml), with the server's settings in a private env file rather than listed
# here, because production carries the Congo profile, Arc bounties and the Circle signer.
#
#   docker compose -f deploy/single-server/compose.yml --env-file /etc/wildsentia/db.env up -d --build
#
# /etc/wildsentia/db.env (mode 600): POSTGRES_PASSWORD, VANA_DOMAIN.
# /etc/wildsentia/server.env (mode 600): every server variable, DATABASE_URL pointing at db:5432.
#
# Every image is pinned by digest (here and in deploy/Dockerfile.*), so a rebuild runs what was
# reviewed. To take a newer image, read its digest (deploy/README.md, "Image digests") and change it
# in one commit. Each container drops every Linux capability it does not need and may not gain more.
name: wildsentia

services:
  db:
    # postgres:18-alpine (18.7), the image production ran when this was pinned on 19 November 2026.
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: vana
      POSTGRES_DB: wildsentia_congo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in db.env}
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18.
      - db_data:/var/lib/postgresql
    # Postgres stays on the compose network: nothing publishes 5432.
    shm_size: 256m
    # The entrypoint fixes the data folder's owner, then runs postgres as its own user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vana -d wildsentia_congo"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  server:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.server
    depends_on:
      db:
        condition: service_healthy
    env_file: /etc/wildsentia/server.env
    # Node runs as the node user on port 8080: it needs no capability at all.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      server:
        condition: service_healthy
    environment:
      VANA_DOMAIN: ${VANA_DOMAIN:?set VANA_DOMAIN in db.env}
      # Cloudflare's ranges when the site is behind it (deploy/single-server/README.md); otherwise none.
      VANA_TRUSTED_PROXIES: ${VANA_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Caddy binds 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

volumes:
  db_data:
  caddy_data:
  caddy_config:
