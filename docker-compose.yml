services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vana
      POSTGRES_PASSWORD: vana
      POSTGRES_DB: vana
    ports: ["5433:5432"]
    volumes:
      - vana-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vana"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://vana:vana@db:5432/vana
      PORT: "8080"
      WORLD_SEED: "1"
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  vana-db:
